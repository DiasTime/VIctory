name: Sync fork
on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC
  workflow_dispatch:       # кнопка ручного запуска
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}